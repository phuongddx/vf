name: Demo video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/.demo-trigger"

permissions:
  contents: write

jobs:
  render-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build vf
        run: cargo build --release --locked

      - name: Render demo video
        env:
          VF_ENGINE: remotion
          VF_LANG: vi
          ZAI_CODING_API_KEY: ""
          ZAI_API_KEY: ""
        run: |
          mkdir -p "$HOME/demo-run"
          cd "$HOME/demo-run"
          "$GITHUB_WORKSPACE/target/release/vf" make "vf video forge demo"
          ls -la vf-projects/vf-video-forge-demo/
          test -f vf-projects/vf-video-forge-demo/draft.mp4

      - name: Commit demo video
        run: |
          cp "$HOME/demo-run/vf-projects/vf-video-forge-demo/draft.mp4" docs/demo.mp4
          ls -la docs/demo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.mp4
          git commit -m "docs: demo video generated by vf (ci render)" || echo "no changes"
          git push
