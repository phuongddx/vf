name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags: ["--locked", "--no-default-features --locked"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Informational until rustfmt runs locally (musl toolchain lacks the component)
      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.flags }} -- -A dead_code

      - name: Tests
        run: cargo test --all ${{ matrix.flags }}

      # Static build check — also proves the TLS feature can link (default leg)
      - name: Static musl build
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release ${{ matrix.flags }} --target x86_64-unknown-linux-musl
