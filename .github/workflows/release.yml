name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all --locked

      - name: Build static binary
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          ART="vf-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl"
          tar -czf "${ART}.tar.gz" -C target/x86_64-unknown-linux-musl/release vf
          sha256sum "${ART}.tar.gz" > "${ART}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            vf-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz \
            vf-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "vf ${GITHUB_REF_NAME}" \
            --generate-notes
