[package]
name = "vf"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
anyhow = "1"
dirs = "5"

[features]
default = ["tls"]
tls = ["reqwest/rustls-tls"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
